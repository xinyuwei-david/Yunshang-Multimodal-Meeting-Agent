name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/audit_no_send.py
      - run: python scripts/audit_public_content.py
      - run: python scripts/validate_evidence.py
      - run: python scripts/validate_sample_runs.py
      - run: python scripts/validate_readmes.py
      - run: python scripts/pre_delivery_check.py
      - run: ruff check src tests scripts
      - run: pytest
      - run: pip-audit -r requirements.txt --progress-spinner off